[workspace]
members = [".", "yewdux-middleware-macros"]

[package]
name = "yewdux-middleware"
version = "0.4.0"
edition = "2021"
keywords = ["yew", "state", "redux", "shared", "container"]
categories = ["wasm", "web-programming", "rust-patterns"]
description = "A Redux-like middleware for Yewdux."
repository = "https://github.com/ivmarkov/yewdux-middleware"
license = "MIT OR Apache-2.0"
readme = "README.md"
#forced-target = "wasm32-unknown-unknown"

[features]
default = ["future"]
future = []
doctests = []

[dependencies]
yew = { version = "0.22.0", default-features = false }
anymap2 = "0.13.0"

# === yewdux embedded dependencies (can be removed if switching back to external yewdux) ===
yewdux-middleware-macros = { path = "./yewdux-middleware-macros" }
log = "0.4.16"
serde = { version = "1.0.114", features = ["rc"] }
serde_json = "1.0.64"
slab = "0.4"
thiserror = "1.0"
web-sys = "0.3"
chrono = "0.4.22"
wasm-bindgen = "0.2"
# === end yewdux embedded dependencies ===

